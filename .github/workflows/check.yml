name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: dmf_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, pdo_mysql, pdo_sqlite, mbstring, xml
          coverage: none
      - run: npm ci
      - run: composer install --working-dir=backend --no-interaction --prefer-dist
      - run: cp backend/.env.example backend/.env
      - run: php backend/artisan key:generate
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: composer audit --working-dir=backend
      - run: php backend/vendor/bin/pint --test backend/app backend/bootstrap/app.php backend/bootstrap/providers.php backend/database backend/routes backend/tests backend/scripts
      - run: composer --working-dir=backend test
      - name: MySQL integration and locking
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dmf_test_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-only
        run: |
          php artisan test
          php scripts/race-check.php
      - name: Prepare isolated browser data
        env:
          DMF_ADMIN_PASSWORD: Local-Dmf-Testing-2026!
        run: |
          touch backend/database/database.sqlite
          php backend/artisan migrate --force
          php backend/artisan dmf:admin admin@dmf.test --name="Admin Uji"
          php backend/artisan dmf:demo
      - run: npx playwright install --with-deps chrome
      - name: Browser checks
        run: |
          php backend/artisan serve --host=127.0.0.1 --port=8000 > /tmp/dmf-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/up && break; sleep 1; done
          npm run test:browser
